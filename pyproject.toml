[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "cb"
version = "0.1.0"
description = "Continuous Batching made Simple"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=4.4.1",
    "transformers>=4.57.3",
    "torch",
    "librosa",
    "soundfile",
    "torchaudio",
    "fastapi",
    "trio",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "black", "mypy"]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100

[tool.mypy]
strict = true

[tool.ruff.lint]
select = ["I"]

[tool.pytest.ini_options]
pythonpath = ["src"]
